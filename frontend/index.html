
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGE - Yasmine Game Engine</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #101722;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #hud {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 2;
            padding: 12px 16px;
            border-radius: 10px;
            background: #101722cc;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <div id="hud">YGE CORE 0.1.0 | INITIALIZING</div>
    <canvas id="renderCanvas"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="src/engine/Engine.js"></script>

    <script>
        const canvas = document.getElementById("renderCanvas");

        const yge = new YGE.Engine(canvas);

        yge.start();

        document.getElementById("hud").textContent =
            "YGE CORE 0.1.0 | RUNNING";
    </script>

</body>
</html>
