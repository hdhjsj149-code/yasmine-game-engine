<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YGE — Test World</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #101722; color: #fff; font-family: system-ui, sans-serif; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; top: 14px; left: 14px; z-index: 2;
      padding: 10px 14px; border-radius: 10px; background: #101722cc;
      font-size: 14px; }
  </style>
</head>
<body>
  <div id="hud">YASMINE GAME ENGINE · TEST WORLD</div>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.45, 0.68, 0.88, 1);

      const camera = new BABYLON.ArcRotateCamera(
        "camera", -Math.PI / 2, Math.PI / 3, 12,
        new BABYLON.Vector3(0, 1, 0), scene
      );
      camera.attachControl(canvas, true);
      camera.wheelPrecision = 45;

      const light = new BABYLON.HemisphericLight(
        "light", new BABYLON.Vector3(0, 1, 0), scene
      );
      light.intensity = 0.9;

      const ground = BABYLON.MeshBuilder.CreateGround(
        "ground", { width: 30, height: 30 }, scene
      );
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.24, 0.48, 0.32);
      ground.material = groundMat;

      const player = BABYLON.MeshBuilder.CreateCapsule(
        "player", { height: 2, radius: 0.45 }, scene
      );
      player.position.y = 1;
      const playerMat = new BABYLON.StandardMaterial("playerMat", scene);
      playerMat.diffuseColor = new BABYLON.Color3(0.18, 0.42, 0.9);
      player.material = playerMat;

      const box = BABYLON.MeshBuilder.CreateBox(
        "testObject", { size: 1.5 }, scene
      );
      box.position = new BABYLON.Vector3(3, 0.75, 2);
      const boxMat = new BABYLON.StandardMaterial("boxMat", scene);
      boxMat.diffuseColor = new BABYLON.Color3(0.85, 0.55, 0.2);
      box.material = boxMat;

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
